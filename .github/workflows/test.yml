name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsnappy-dev ffmpeg swig

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: requirements.lock

      - name: Create venv and install Python dependencies
        run: |
          uv venv --python 3.10 .venv
          VIRTUAL_ENV=.venv uv pip install -r requirements.lock

      - name: Lint (flake8 + black, config from setup.cfg / pyproject.toml)
        # Non-blocking: the repo has pre-existing findings (2 unused imports,
        # 3 files black would reformat, in deep_rl_zoo/ and frontend/) that are out of scope for this change.
        continue-on-error: true
        run: |
          VIRTUAL_ENV=.venv uv pip install flake8==6.0.0 flake8-black==0.3.6 black==23.7.0
          .venv/bin/flake8 .
          .venv/bin/black --check .

      - name: Install Atari ROMs
        run: .venv/bin/AutoROM --accept-license

      - name: Run upstream unit tests
        run: |
          source .venv/bin/activate
          PYTHONPATH=. ./run_unit_tests.sh

      - name: Run frontend API tests
        run: |
          source .venv/bin/activate
          PYTHONPATH=. pytest frontend/test_server.py -v

      - name: Smoke test bundled checkpoint
        run: |
          source .venv/bin/activate
          python -m deep_rl_zoo.iqn.eval_agent \
            --environment_name=Pong \
            --load_checkpoint_file=./checkpoints/IQN_Pong_2.ckpt \
            --num_iterations=1 \
            --num_eval_steps=200 \
            --nouse_tensorboard
